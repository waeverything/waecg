<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Toasts</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body class="m-4! flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <h1 class="font-bold">Left</h1>
        <input id="leftTitleInput" class="rounded p-2 border-2 border-slate-500 outline-0 focus:border-sky-500" type="text" placeholder="Title" />
        <input id="leftSubtitleInput" class="rounded p-2 border-2 border-slate-500 outline-0 focus:border-sky-500" type="text" placeholder="Subtitle" />
      </div>
      <div class="flex flex-col gap-2">
        <h1 class="font-bold">Right</h1>
        <input id="rightTitleInput" class="rounded p-2 border-2 border-slate-500 outline-0 focus:border-sky-500" type="text" placeholder="Title" />
        <input id="rightSubtitleInput" class="rounded p-2 border-2 border-slate-500 outline-0 focus:border-sky-500" type="text" placeholder="Subtitle" />
      </div>
    </div>
    <div class="flex gap-1">
      <button data-show="left" class="bg-sky-600 font-bold cursor-pointer p-2 flex-1 rounded-l hover:bg-sky-500">Show left</button>
      <button data-show="both" class="bg-sky-600 font-bold cursor-pointer p-2 flex-1 hover:bg-sky-500">Show both</button>
      <button data-show="right" class="bg-sky-600 font-bold cursor-pointer p-2 flex-1 rounded-r hover:bg-sky-500">Show right</button>
    </div>
    <div class="flex flex-col gap-2">
      <h1 class="font-bold">Bottom</h1>
      <input id="bottomInput" class="rounded p-2 border-2 border-slate-500 outline-0 focus:border-sky-500" type="text" placeholder="Bottom panel text" id="bottomToastContent" name="bottomToastContent" />
      <button data-show="bottom" class="bg-sky-600 font-bold cursor-pointer p-2 rounded hover:bg-sky-500">Show bottom</button>
    </div>
    <script src="./js/toasts.js" type="module"></script>
  </body>
</html>
